# This blueprint defines the appearance and fields for legal pages like Impressum and Datenschutz
title: Legal Page
icon: legal

status:
  draft: true
  unlisted: true
  listed: true

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          headline:
            label: Page Headline
            type: text
          legal_sections:
            label: Text Abschnitte (werden durch Striche getrennt)
            type: structure
            fields:
              text:
                label: Textbereich
                type: writer
                nodes:
                  - heading
                  - bulletList
                  - orderedList
            
  sidebar:
    width: 1/3
    sections:
      pages:
        type: pages
        template: default
      files:
        type: files
