title: Home
icon: 🏠

options:
  changeStatus: false

columns:
  main:
    width: 2/3
    sections:
      bookSection:
        type: fields
        fields:
          bookHeadline:
            label: Buch Headline
            type: text
          bookIntro:
            label: Text zum Buch
            type: textarea
            buttons:
              - bold
              - italic
              - link
          ctaText:
            label: Button Text (z.B. "Jetzt kaufen")
            type: text
            width: 1/2
          ctaUrl:
            label: Button Link
            type: url
            width: 1/2
            
      reviewsSection:
        type: fields
        fields:
          reviewsList:
            label: Rezensionen hinzufügen
            type: structure
            fields:
              reviewTitle:
                label: Titel / Quelle (z.B. "5 Sterne – Amazon")
                type: text
              reviewText:
                label: Zitat / Text
                type: textarea
                size: small
                buttons:
                  - bold
                  - italic
              reviewAuthor:
                label: Autor / Medium
                type: text
      
      aboutBookSection:
        type: fields
        fields:
          aboutHeadline:
            label: Über das Buch Überschrift
            type: text
            default: "Über das Buch"
          aboutText:
            label: Text über das Buch
            type: textarea
            buttons:
              - bold
              - italic
              - link
          aboutHighlights:
            label: Kapitel / Highlight-Boxen
            type: structure
            fields:
              highlightTitle:
                label: Titel (z.B. Kapitel 1 oder Key-Takeaway)
                type: text
              highlightText:
                label: Kurze Beschreibung
                type: textarea
                size: small

      projectsSection:
        type: fields
        fields:
          projectsHeadline:
            label: Projekte Kachel Headline
            type: text
          projectsIntro:
            label: Projekte Kurztext
            type: textarea
            size: small
            buttons: false
          projectsLinkText:
            label: Projekte Button Text
            type: text
            width: 1/2
          projectsLinkUrl:
            label: Projekte Verlinkung
            type: pages
            max: 1
            width: 1/2

  sidebar:
    width: 1/3
    sections:
      mediaSection:
        type: fields
        fields:
          bookCover:
            label: Buchcover (Hochkant)
            type: files
            max: 1
            layout: cards
            multiple: false
