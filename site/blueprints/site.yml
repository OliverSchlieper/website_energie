# The `site.yml` blueprint defines the look of the start page (Dashboard) of the Panel.
# More about the site blueprint: https://getkirby.com/docs/reference/panel/blueprints/site

tabs:
  # --- TAB 1: SEITEN ---
  pagesTab:
    label: Seiten
    icon: page
    sections:
      pages:
        type: pages
        create: default
        templates:
          - home
          - default
          - about
          - authors
          - projekte
          - projekt-raphael
          - projekt-default

  # --- TAB 2: FOOTER ---
  footerTab:
    label: Footer Einstellungen
    icon: text
    columns:
      - width: 1/2
        fields:
          footerHeadline:
            label: Footer Überschrift
            type: text
            default: "Kontakt & Infos"
          footerText:
            label: Footer Text / Adresse
            type: textarea
            buttons:
              - bold
              - italic
              - link
            size: small
      
      - width: 1/2
        fields:
          footerLinks:
            label: Wichtige Links
            type: structure
            fields:
              linkText:
                label: Link Text
                type: text
              linkUrl:
                label: URL
                type: url
          socialLinks:
            label: Social Media
            type: structure
            fields:
              platformName:
                label: Plattform (z.B. Instagram)
                type: text
              platformUrl:
                label: Profil URL
                type: url
